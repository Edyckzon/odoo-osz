name: Validate OSZ addons
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  install:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      COMPOSE_PROJECT_NAME: osz-ci
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Generate disposable configuration
        run: python3 scripts/init-local.py
      - name: Validate Compose and Python
        run: |
          docker compose config --quiet
          python3 -m compileall -q custom-addons scripts
      - name: Start database
        run: docker compose up -d --wait db
      - name: Install branding in a fresh database
        run: docker compose run --rm -T odoo odoo -d osz_ci -i osz_branding --without-demo=all --stop-after-init --test-enable --http-port=8070
      - name: Remove disposable CI resources
        if: always()
        run: docker compose down --volumes --remove-orphans
